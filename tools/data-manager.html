<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합 데이터 관리 | mathkoni</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1e293b;font:14px system-ui,sans-serif;padding:20px}main{max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#526579}section{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:18px;margin:14px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{font:inherit;font-weight:650;padding:8px 13px;border:1px solid #cbd5e1;border-radius:7px;color:#334155;background:#fff;cursor:pointer}button.primary{background:#2458a6;color:white;border-color:#2458a6}button:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse;margin:10px 0}td,th{text-align:left;border-bottom:1px solid #e2e8f0;padding:10px 7px}th{background:#f1f5f9}td:last-child,th:last-child{text-align:right}.status{white-space:pre-wrap;color:#166534}.error{color:#a52323}label{cursor:pointer}small{color:#64748b}</style></head><body><main><h1>통합 데이터 관리</h1><p>이 브라우저에 저장된 업무 도구 자료를 한 번에 백업하거나 선택 복원합니다. 서버에 파일을 전송하지 않습니다.</p><section><h2>저장 현황 및 백업</h2><table><thead><tr><th>프로그램</th><th>저장 상태</th><th>선택</th></tr></thead><tbody id="current"></tbody></table><div class="row"><button id="refresh">새로 확인</button><button id="backup" class="primary">선택 자료 백업</button><button id="backupAll">전체 백업</button></div><p>백업에는 학생 정보가 포함될 수 있습니다. 학교에서 승인한 저장 장소에 보관하고 공개 GitHub에 올리지 마세요.</p></section><section><h2>백업 파일 복원</h2><p>다른 프로그램 창을 모두 닫은 뒤 복원하세요. 선택한 자료만 교체되며, 복원 전 현재 자료를 별도 JSON으로 내려받습니다.</p><input id="file" type="file" accept=".json,application/json"><div id="incoming"></div><div class="row"><button id="restore" class="primary" disabled>선택 자료 복원</button></div></section><p class="status" id="status" role="status"></p></main><script>
'use strict';
const tools=[
 {key:'mathDiary_autoSaveData',name:'수행평가 관리',prev:'mathDiary_previousAutoSaveData',valid:v=>v&&Array.isArray(v.config)&&Array.isArray(v.students)},
 {key:'mathkoni-achievement-target-v1',name:'성취도 목표점수',prev:'mathkoni-achievement-target-v1-previous',valid:v=>v&&v.version===1&&Array.isArray(v.evals)&&Array.isArray(v.students)&&Array.isArray(v.levels)&&v.levels.length>0&&v.students.length>0},
 {key:'seatingData',name:'스마트 자리배치',prev:'seatingData-previous',valid:v=>v&&((Array.isArray(v.layouts)&&v.layouts.length>1&&v.layouts.every(l=>l&&Array.isArray(l.students)))||Array.isArray(v.students))},
 {key:'scoreSysVFinal_AutoSave',name:'활동수학 점수·상점',prev:'scoreSysVFinal_AutoSave-previous',valid:v=>v&&v.base&&v.history&&v.board},
 {key:'hiedu_dbData',name:'문자발송 기초자료',prev:'hiedu_dbData-previous',valid:Array.isArray},
 {key:'hiedu_targetData',name:'문자발송 대상자',prev:'hiedu_targetData-previous',valid:Array.isArray},
 {key:'mathkoni-merit-v1',name:'상벌점 단체입력',prev:'mathkoni-merit-v1-previous',valid:v=>v&&Array.isArray(v.students)&&Array.isArray(v.items)&&Array.isArray(v.records)}
];
const $=id=>document.getElementById(id);let incoming=null;
function status(t,error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function download(entries,label){const payload={format:'mathkoni-tools-backup-v1',createdAt:new Date().toISOString(),entries};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=label+'_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function readEntry(t){return localStorage.getItem(t.key)}
function show(){try{const root=$('current');root.replaceChildren();for(const t of tools){const raw=readEntry(t);const tr=document.createElement('tr');for(const v of [t.name,raw===null?'저장 자료 없음':Math.ceil(new Blob([raw]).size/1024)+' KB 저장됨']){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),c=document.createElement('input');c.type='checkbox';c.value=t.key;c.checked=raw!==null;c.disabled=raw===null;c.setAttribute('aria-label',t.name+' 백업 선택');td.append(c);tr.append(td);root.append(tr)}}catch(e){status('저장 공간에 접근할 수 없습니다: '+e.message,true)}}
function backup(all){try{const selected=new Set([...$('current').querySelectorAll('input:checked')].map(x=>x.value));const entries={};for(const t of tools)if(all||selected.has(t.key)){const raw=readEntry(t);if(raw!==null)entries[t.key]=raw}if(!Object.keys(entries).length)throw Error('백업할 자료가 없습니다.');download(entries,'mathkoni_전체백업');status(Object.keys(entries).length+'개 저장 자료 백업 파일 생성')}catch(e){status(e.message,true)}}
$('backup').onclick=()=>backup(false);$('backupAll').onclick=()=>backup(true);$('refresh').onclick=show;
$('file').onchange=async e=>{incoming=null;$('incoming').replaceChildren();$('restore').disabled=true;try{const f=e.target.files[0];if(!f)return;const parsed=JSON.parse(await f.text());if(parsed.format!=='mathkoni-tools-backup-v1'||!parsed.entries||typeof parsed.entries!=='object')throw Error('통합 백업 파일 형식이 아닙니다. 개별 JSON은 해당 프로그램에서 복원하세요.');incoming={};for(const t of tools){if(!Object.prototype.hasOwnProperty.call(parsed.entries,t.key))continue;const raw=parsed.entries[t.key];if(typeof raw!=='string'||!t.valid(JSON.parse(raw)))throw Error(t.name+' 자료 형식이 올바르지 않습니다.');incoming[t.key]=raw;const label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.value=t.key;label.append(c,document.createTextNode(' '+t.name));const p=document.createElement('p');p.append(label);$('incoming').append(p)}if(!Object.keys(incoming).length)throw Error('지원하는 자료가 없습니다.');$('restore').disabled=false;status('복원할 프로그램을 선택하세요.')}catch(err){incoming=null;$('incoming').replaceChildren();status(err.message,true)}};
$('restore').onclick=()=>{if(!incoming)return;const chosen=[...$('incoming').querySelectorAll('input:checked')].map(c=>c.value);if(!chosen.length)return status('복원 대상을 선택하세요.',true);if(!confirm('다른 업무 도구 창을 닫았습니까? 선택한 '+chosen.length+'개 자료를 교체합니다.'))return;const old={},written=[];try{for(const key of chosen){const t=tools.find(x=>x.key===key);old[key]=readEntry(t);if(!t.valid(JSON.parse(incoming[key])))throw Error(t.name+' 자료 오류')}const pre=Object.fromEntries(Object.entries(old).filter(([,v])=>v!==null));if(Object.keys(pre).length){download(pre,'mathkoni_복원전백업');if(!confirm('복원 전 백업 파일을 보관했습니까? 확인하면 복원합니다.'))return}for(const key of chosen){if(localStorage.getItem(key)!==old[key])throw Error('다른 창에서 자료가 변경되었습니다. 복원을 중단합니다.');const t=tools.find(x=>x.key===key);if(old[key]!==null)localStorage.setItem(t.prev,old[key]);localStorage.setItem(key,incoming[key]);written.push(key);if(localStorage.getItem(key)!==incoming[key])throw Error('저장 확인 실패')}show();status(chosen.length+'개 자료 복원 완료. 해당 프로그램을 다시 열어 확인하세요.')}catch(e){let rollback=true;for(const key of written.reverse()){try{if(old[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,old[key])}catch(_){rollback=false}}show();status('복원 실패: '+e.message+(rollback?' · 변경 자료 되돌림 완료':' · 일부 되돌리기 실패, 복원 전 백업 사용 필요'),true)}};
show();window.addEventListener('storage',show);
</script></body></html>
